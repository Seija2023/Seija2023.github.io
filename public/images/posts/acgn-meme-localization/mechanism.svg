<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">从日本ACGN原作到中文互联网模因</title><desc id="d">两条案例路径和共享传播机制，定性分析图，不表示规模。</desc><rect width="1200" height="650" fill="#101c2d"/><g font-family="system-ui, 'Noto Sans CJK SC', sans-serif" fill="#eef4ff"><text x="64" y="75" font-size="35" font-weight="700">从原作到模因：两条本土再生产路径</text><text x="66" y="115" font-size="19" fill="#a9bbd1">赛马娘 × BanG Dream! ｜ 2021—2026 ｜ 定性机制示意</text><g font-size="23" font-weight="600"><rect x="64" y="170" width="300" height="115" rx="15" fill="#173d43" stroke="#58cbb5"/><text x="88" y="212">赛马娘</text><text x="88" y="250" font-size="18">蜂蜜之歌 / 曼波语音</text><rect x="64" y="342" width="300" height="115" rx="15" fill="#3d2e48" stroke="#cf9ad8"/><text x="88" y="385">BanG Dream!</text><text x="88" y="423" font-size="18">春日影 / 高松灯 / 群像</text><rect x="440" y="170" width="300" height="115" rx="15" fill="#173d43" stroke="#58cbb5"/><text x="464" y="212">声音与语义变异</text><text x="464" y="250" font-size="18">音MAD → 萌宠 → 通用音效</text><rect x="440" y="342" width="300" height="115" rx="15" fill="#3d2e48" stroke="#cf9ad8"/><text x="464" y="385">人格与叙事重构</text><text x="464" y="423" font-size="18">抽象语音 / 跨情境改编</text><rect x="816" y="210" width="320" height="210" rx="18" fill="#26384d" stroke="#9cb6d5"/><text x="840" y="253">跨圈层传播</text><text x="840" y="294" font-size="18">模因使用者 ≠ 原作粉丝</text><text x="840" y="329" font-size="18">网络声量 ≠ 商业转化</text><text x="840" y="364" font-size="18">地域性 ≠ 全球普遍性</text></g><g fill="none" stroke="#a9bbd1" stroke-width="3"><path d="M364 227 H426 l-10 -8 m10 8 l-10 8"/><path d="M364 399 H426 l-10 -8 m10 8 l-10 8"/><path d="M740 227 H778 L806 273 l-12 -3 m12 3 l-4 -12"/><path d="M740 399 H778 L806 361 l-12 3 m12 -3 l-4 12"/></g><rect x="64" y="510" width="1072" height="75" rx="12" fill="#1b2b40"/><text x="88" y="542" font-size="20" font-weight="600">共享条件：参与式创作、跨平台搬运、短视频推荐、语音合成与本地语境</text><text x="88" y="568" font-size="15" fill="#a9bbd1">原作、二创与商业反馈之间并非必然因果关系；图示由本文绘制。</text><text x="66" y="625" font-size="15" fill="#a9bbd1">ACGN / MEME / CULTURAL REPRODUCTION</text></g></svg>